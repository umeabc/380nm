services:
  bili-dyn:
    build: .
    image: bili-dyn-publisher:latest
    container_name: bili-dyn-publisher
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=8787
      # 存储驱动：local（本地磁盘，默认）或 r2（Cloudflare R2）
      # 真实凭据请写在本目录的 .env（已 gitignore），不要提交到仓库
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_PUBLIC_BASE=${R2_PUBLIC_BASE:-}
      # 缩略默认开启，关闭仅用于故障降级
      - THUMB_ENABLED=${THUMB_ENABLED:-1}
      - THUMB_CONCURRENCY=${THUMB_CONCURRENCY:-2}
      - THUMB_CACHE_MAX_MB=${THUMB_CACHE_MAX_MB:-512}
      - THUMB_CACHE_DAYS=${THUMB_CACHE_DAYS:-30}
      - THUMB_FETCH_TIMEOUT_MS=${THUMB_FETCH_TIMEOUT_MS:-10000}
      # Cookie 自动续期（严格 0/1）
      - COOKIE_AUTO_REFRESH=${COOKIE_AUTO_REFRESH:-1}
      # 反向代理部署必须设为 1，否则登录限速的 IP 维度会退化成全局阈值
      - TRUST_PROXY=${TRUST_PROXY:-0}
      # 登录失败限速（默认 5 次用户名 / 20 次 IP / 15 分钟）
      - LOGIN_MAX_FAILURES=${LOGIN_MAX_FAILURES:-5}
      - LOGIN_MAX_FAILURES_IP=${LOGIN_MAX_FAILURES_IP:-20}
      - LOGIN_WINDOW_MS=${LOGIN_WINDOW_MS:-900000}
      - LOGIN_THROTTLE_MAX_ENTRIES=${LOGIN_THROTTLE_MAX_ENTRIES:-5000}
    volumes:
      - ./data:/app/data
