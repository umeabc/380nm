services:
  bili-dyn:
    build: .
    image: bili-dyn-publisher:latest
    container_name: bili-dyn-publisher
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=8787
      # 存储驱动：local（本地磁盘，默认）或 r2（Cloudflare R2）
      # 真实凭据请写在本目录的 .env（已 gitignore），不要提交到仓库
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_PUBLIC_BASE=${R2_PUBLIC_BASE:-}
    volumes:
      - ./data:/app/data
