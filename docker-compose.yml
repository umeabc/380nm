services:
  bili-dyn:
    build: .
    image: bili-dyn-publisher:latest
    container_name: bili-dyn-publisher
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=8787
      # 需要时启用 R2 存储：
      # - STORAGE_DRIVER=r2
      # - R2_ACCOUNT_ID=
      # - R2_ACCESS_KEY_ID=
      # - R2_SECRET_ACCESS_KEY=
      # - R2_BUCKET=
      # - R2_PUBLIC_BASE=
    volumes:
      - ./data:/app/data
