<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>发布动态 · 380nm</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="nav-backdrop" id="nav-backdrop"></div>
<div class="main-shell">
  <header class="topbar" id="topbar"></header>
  <main class="page" id="page">
    <div id="no-account-warn" class="warn" style="display:none">还没有可用的B站账号，请先到「账号管理」添加 SESSDATA 和 bili_jct。</div>
    <div class="grid2">
      <div class="stack">
        <div class="card">
          <div class="card-h">账号与模板</div>
          <div class="frow">
            <div class="fld"><label>发布账号</label><select id="sel-account"></select></div>
            <div class="fld"><label>动态模板</label><select id="sel-template"></select></div>
          </div>
        </div>
        <div class="card">
          <div class="card-h">动态标题<span class="hint-r">可选 · <span id="title-count">0</span>/20 字</span></div>
          <input id="dyn-title" maxlength="20" placeholder="给这条动态起个标题（图文动态显示在图片上方）">
        </div>
        <div class="card">
          <div class="card-h">模板变量<span class="hint-r">使用 <span class="kbd">{{占位符}}</span> 自动填充</span></div>
          <div id="var-fields"></div>
        </div>
        <div class="card">
          <div class="card-h">发布时间</div>
          <div class="frow">
            <div class="fld" style="max-width:250px"><label>计划时间</label><input type="datetime-local" id="time-input" step="60"></div>
          </div>
          <div class="presets" id="presets" style="margin-top:12px">
            <button type="button" data-preset="today20">今天 20:00</button>
            <button type="button" data-preset="tomorrow8">明天 08:00</button>
            <button type="button" data-preset="tomorrow20">明天 20:00</button>
            <button type="button" data-preset="1h">1小时后</button>
            <button type="button" data-preset="now">立即发布</button>
          </div>
          <div class="hint" style="margin-top:10px">到点自动发布；所选时间已过则保存后立即发布。</div>
        </div>
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-h">配图<span class="hint-r"><button class="btn sm" id="pick-upload-btn" type="button">上传图片</button><span class="hint">最多 <b id="img-max">9</b> 张，按选择顺序发布</span></span></div>
          <input type="file" id="file-input" accept="image/*" multiple style="display:none">
          <div class="sel-strip" id="sel-strip"></div>
          <div class="pick-body">
            <div class="pick-folders" id="pick-folders"></div>
            <div class="pick-right">
              <div class="img-grid" id="img-grid"></div>
              <div class="pick-pager" id="pick-pager"></div>
            </div>
          </div>
          <div class="hint" style="margin-top:8px">左侧切换文件夹浏览；上传的图片存入当前所选文件夹（“全部图片 / 未分类”时存入未分类）。</div>
        </div>
        <div class="card">
          <div class="card-h">话题<span class="hint-r">可选 · 绑定B站话题并追加 #话题名# 到正文</span></div>
          <div class="recent-topics" id="recent-topics" style="display:none"></div>
          <div class="topic-wrap">
            <input id="topic-input" placeholder="输入关键词搜索话题（如：日常），点击结果选择" autocomplete="off">
            <div class="topic-dd" id="topic-dd" style="display:none"></div>
          </div>
          <div class="sel-topic" id="topic-selected" style="display:none"></div>
        </div>
        <div class="card">
          <div class="card-h">预览与提交</div>
          <div class="preview" id="preview-text"></div>
          <div class="hint" style="margin:8px 0 14px"><span id="preview-count"></span></div>
          <button class="btn primary" id="btn-submit">加入发布队列</button>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="toast-wrap"></div>
<script src="/js/common.js"></script>
<script src="/js/pages/release.js"></script>
</body>
</html>
