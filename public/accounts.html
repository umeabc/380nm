<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>账号管理 · 380nm</title>
<link rel="stylesheet" href="/css/app.css?v=12">
</head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="nav-backdrop" id="nav-backdrop"></div>
<div class="main-shell">
  <header class="topbar" id="topbar"></header>
  <main class="page" id="page">
    <div class="card">
      <div class="card-h">添加B站账号</div>
      <div class="frow">
        <div class="fld"><label>备注名（可选）</label><input id="acc-name" placeholder="如：主号"></div>
        <div class="fld"><label>SESSDATA</label><input id="acc-sessdata" placeholder="浏览器 Cookie 中的 SESSDATA"></div>
        <div class="fld"><label>bili_jct</label><input id="acc-jct" placeholder="浏览器 Cookie 中的 bili_jct"></div>
        <button class="btn primary" id="btn-acc-add">验证并添加</button>
      </div>
      <div class="hint" style="margin-top:10px">
        获取方式：电脑浏览器登录 bilibili.com → F12 打开开发者工具 → 应用(Application) → Cookie → 复制 SESSDATA 和 bili_jct 两个值。账号仅本人可见，Cookie 仅用于发布动态。
      </div>
    </div>
    <div class="card mt">
      <div class="card-h">我的B站账号</div>
      <div id="acc-list"></div>
    </div>
  </main>
</div>
<div id="toast-wrap"></div>
<script src="/js/common.js?v=12"></script>
<script src="/js/pages/accounts.js?v=12"></script>
</body>
</html>
