<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>图片库 · 380nm</title>
<link rel="stylesheet" href="/css/app.css?v=7">
</head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="nav-backdrop" id="nav-backdrop"></div>
<div class="main-shell">
  <header class="topbar" id="topbar"></header>
  <main class="page" id="page">
    <div class="split">
      <div class="card">
        <div class="card-h">文件夹</div>
        <div id="folder-list"></div>
        <button class="btn" id="btn-folder-new" style="width:100%;justify-content:center;margin-top:8px">新建文件夹</button>
      </div>
      <div class="card" style="min-width:0">
            <div class="card-h">图片库<span class="hint-r">
              <span class="hint" id="lib-stats"></span>
              <label class="scope-toggle" id="scope-lib-wrap" style="display:none"><input type="checkbox" id="scope-lib"> 查看全部用户</label>
              <a href="/settings" id="import-settings-link" style="display:none;color:var(--brand)">导入设置</a>
              <span>悬停图标移动 / 删除</span>
            </span></div>
            <div class="frow" style="margin-bottom:14px">
              <div class="fld" style="flex:3;min-width:220px">
                <label>链接导入（Pixiv 作品页 / X 推文 / 直接图片链接）</label>
                <input id="import-url" placeholder="https://www.pixiv.net/artworks/... 或 https://x.com/.../status/...">
              </div>
              <button class="btn" id="btn-import" style="min-height:40px">导入到当前文件夹</button>
            </div>
            <div class="drop" id="lib-drop">点击选择或拖拽图片上传（上传到当前所选文件夹）</div>
            <input type="file" id="lib-file" accept="image/*" multiple style="display:none">
            <div class="lib-toolbar" id="lib-toolbar">
              <span class="hint" id="sel-count">未选择图片</span>
              <button class="btn sm" id="btn-sel-all" type="button">全选</button>
              <button class="btn sm" id="btn-sel-none" type="button">清空选择</button>
              <span class="spacer"></span>
              <button class="btn sm" id="btn-batch-move" type="button" disabled>移动到…</button>
              <button class="btn sm" id="btn-batch-export" type="button" disabled>导出 ZIP</button>
              <button class="btn sm danger" id="btn-batch-del" type="button" disabled>删除所选</button>
              <button class="btn sm danger" id="btn-clear-view" type="button" title="删除当前视图中全部图片（被待发布任务引用的会跳过）">清空当前视图</button>
            </div>
            <div class="img-grid" id="lib-grid" style="margin-top:14px"></div>
      </div>
    </div>
  </main>
</div>
<div id="toast-wrap"></div>
<div id="move-menu" class="move-menu" style="display:none"></div>
<script src="/js/common.js?v=7"></script>
<script src="/js/pages/library.js?v=7"></script>
</body>
</html>
