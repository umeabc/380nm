<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EFE7">
<title>登录 · 380nm</title>
<link rel="stylesheet" href="/css/app.css?v=27">
<link rel="stylesheet" href="/css/login.css?v=27">
</head>
<body class="anon">
<main class="login-shell">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-art" aria-hidden="true">
      <svg class="login-botanical" viewBox="0 0 480 680" xmlns="http://www.w3.org/2000/svg" focusable="false" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="leaf-front" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#A8BDB5"/>
            <stop offset=".48" stop-color="#6F928B"/>
            <stop offset="1" stop-color="#446B66"/>
          </linearGradient>
          <linearGradient id="leaf-back" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#C9D4CA"/>
            <stop offset="1" stop-color="#86A49A"/>
          </linearGradient>
          <linearGradient id="leaf-blue" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#A7BCC0"/>
            <stop offset="1" stop-color="#5B7D81"/>
          </linearGradient>
          <path id="leaf-shape" d="M0 0 C-58-9-101-62-80-144 C-20-141 27-79 0 0Z"/>
          <path id="leaf-vein" d="M0 0 Q-40-63-80-144 M-18-34 L-57-49 M-34-65 L-69-82 M-48-89 L-43-116" fill="none" stroke="#E5EBDF" stroke-width="1" stroke-opacity=".34"/>
        </defs>
        <circle cx="125" cy="170" r="131" fill="#EDF0DF" opacity=".47"/>
        <circle cx="440" cy="570" r="230" fill="#7D9E96" opacity=".09"/>
        <g opacity=".43" transform="translate(426 696) rotate(18)">
          <path d="M0 0 Q-80-224-55-453" fill="none" stroke="#91A89A" stroke-width="3"/>
          <use href="#leaf-shape" transform="translate(-33 -108) rotate(-29) scale(1.1)" fill="url(#leaf-back)"/>
          <use href="#leaf-shape" transform="translate(-54 -223) rotate(83) scale(.97)" fill="url(#leaf-back)"/>
          <use href="#leaf-shape" transform="translate(-57 -311) rotate(-23) scale(.85)" fill="url(#leaf-back)"/>
          <use href="#leaf-shape" transform="translate(-55 -402) rotate(61) scale(.7)" fill="url(#leaf-back)"/>
        </g>
        <g transform="translate(112 724) rotate(-8)">
          <path d="M0 0 C47-146 130-345 154-569" fill="none" stroke="#54766D" stroke-width="3"/>
          <g transform="translate(42 -129) rotate(-24) scale(1.43)"><use href="#leaf-shape" fill="url(#leaf-front)"/><use href="#leaf-vein"/></g>
          <g transform="translate(74 -212) rotate(97) scale(1.39)"><use href="#leaf-shape" fill="url(#leaf-blue)"/><use href="#leaf-vein"/></g>
          <g transform="translate(100 -298) rotate(-22) scale(1.3)"><use href="#leaf-shape" fill="url(#leaf-front)"/><use href="#leaf-vein"/></g>
          <g transform="translate(125 -384) rotate(91) scale(1.16)"><use href="#leaf-shape" fill="url(#leaf-front)"/><use href="#leaf-vein"/></g>
          <g transform="translate(143 -458) rotate(-12) scale(1.04)"><use href="#leaf-shape" fill="url(#leaf-back)"/><use href="#leaf-vein"/></g>
          <g transform="translate(154 -538) rotate(39) scale(.85)"><use href="#leaf-shape" fill="url(#leaf-front)"/><use href="#leaf-vein"/></g>
        </g>
      </svg>
      <div class="login-art-caption"><span class="login-art-line"></span>让灵感，有序发生。</div>
    </div>
    <div class="login-content">
      <div class="login-brand"><span class="login-brand-symbol" aria-hidden="true"></span>380nm</div>
      <header class="login-heading">
        <h1 id="login-title">欢迎回来</h1>
        <p>登录，继续安排你的下一条动态。</p>
      </header>
      <form id="login-form" class="login-fields">
        <div class="login-field">
          <label class="login-sr-only" for="login-username">用户名</label>
          <input id="login-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="请输入用户名" required>
        </div>
        <div class="login-field">
          <label class="login-sr-only" for="login-password">密码</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        </div>
        <div class="login-err" id="login-err" role="alert" aria-live="polite" style="display:none"></div>
        <button type="submit" id="login-submit">登录</button>
      </form>
      <footer class="login-notes">
        <p>会话有效期 30 天</p>
        <p>忘记密码？请联系管理员</p>
      </footer>
    </div>
  </section>
  <p class="login-page-note">380nm · B 站动态发布后台</p>
</main>
<script src="/js/pages/login.js?v=27"></script>
</body>
</html>
