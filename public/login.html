<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · 380nm</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="anon">
<div class="login-wrap">
  <div class="login-card">
    <div class="brand2">380nm</div>
    <div class="sub">B站动态定时发布后台 · 请登录以继续</div>
    <div class="login-err" id="login-err"></div>
    <form id="login-form">
      <div class="fld"><label>用户名</label><input id="login-username" autocomplete="username" placeholder="用户名"></div>
      <div class="fld"><label>密码</label><input id="login-password" type="password" autocomplete="current-password" placeholder="密码"></div>
      <button class="btn primary" type="submit" id="login-submit">登 录</button>
    </form>
    <div class="login-foot">会话有效期 30 天 · 忘记密码请联系管理员</div>
  </div>
</div>
<script src="/js/pages/login.js"></script>
</body>
</html>
